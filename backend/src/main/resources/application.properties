spring.application.name=sga
server.port=8080

# Persistencia en archivo serializado
sga.datos.archivo=./datos/sga.dat
sga.datos.escenario-si-vacio=true
sga.zona-horaria=America/Bogota
sga.cors.origenes=http://localhost:4200,http://127.0.0.1:4200

# Fechas ISO en JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Bogota
spring.jackson.default-property-inclusion=always

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
server.tomcat.max-http-form-post-size=5MB
spring.mvc.problemdetails.enabled=false
